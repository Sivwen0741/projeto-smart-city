name: scoc

x-banco: &banco
  image: postgis/postgis:16-3.4-alpine
  environment:
    POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
    POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
    POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 20

x-conexao: &conexao
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  db:
    <<: *banco
    volumes:
      - dados-banco:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORTA_LOCAL:-5432}:5432"

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - dados-mosquitto:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORTA_LOCAL:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: execucao
    environment:
      <<: *conexao
      DB_HOST: db
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORTA_LOCAL:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  simulador:
    build: ./simulador
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIMULADOR_INTERVALO_SEGUNDOS: ${SIMULADOR_INTERVALO_SEGUNDOS:-30}
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORTA_LOCAL:-8080}:80"

  db-teste:
    <<: *banco
    profiles: ["teste"]
    tmpfs:
      - /var/lib/postgresql/data

  mosquitto-teste:
    image: eclipse-mosquitto:2.0.20
    profiles: ["teste"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    tmpfs:
      - /mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-teste:
    profiles: ["teste"]
    build:
      context: ./api
      target: teste
    environment:
      <<: *conexao
      DB_HOST: db-teste
      MQTT_URL: mqtt://mosquitto-teste:1883
      # os testes disparam a verificação da us07 por conta própria
      VERIFICACAO_COMUNICACAO_SEGUNDOS: "0"
    depends_on:
      db-teste:
        condition: service_healthy
      mosquitto-teste:
        condition: service_healthy

volumes:
  dados-banco:
  dados-mosquitto:
